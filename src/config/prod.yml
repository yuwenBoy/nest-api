# 权限白名单（不变）
perm:
  router:
    whitelist: [
      { path: '/basic-api/auth/login', method: 'POST' },
      { path: '/basic-api/auth/logout', method: 'GET' },
      { path: '/basic-api/auth/authcode', method: 'GET' }
    ]

